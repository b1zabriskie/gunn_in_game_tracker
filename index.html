<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soccer Data Collection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Soccer Data Collection</h1>

    <p>Tap the location where the action started.</p>

    <div class="pitch-container">

        <div class="goal-label">
            OPPONENT GOAL
        </div>

        <svg
            id="pitch"
            viewBox="0 0 68 105"
            preserveAspectRatio="none"
        >

            <!-- Green field -->
            <rect
                x="0"
                y="0"
                width="68"
                height="105"
                class="pitch-background"
            />

            <!-- Outer boundary -->
            <rect
                x="0"
                y="0"
                width="68"
                height="105"
                class="line"
            />


            <!-- =========================
                 CENTER LINE
                 ========================= -->

            <line
                x1="0"
                y1="52.5"
                x2="68"
                y2="52.5"
                class="line"
            />


            <!-- =========================
                 CENTER CIRCLE
                 ========================= -->

            <circle
                cx="34"
                cy="52.5"
                r="9.15"
                class="line"
            />

            <circle
                cx="34"
                cy="52.5"
                r="0.5"
                class="spot"
            />


            <!-- =========================
                 TOP PENALTY AREA
                 ========================= -->

            <rect
                x="12.9"
                y="0"
                width="42.2"
                height="16.5"
                class="line"
            />

            <rect
                x="24.84"
                y="0"
                width="18.32"
                height="5.5"
                class="line"
            />

            <!-- Top penalty spot -->
            <circle
                cx="34"
                cy="11"
                r="0.5"
                class="spot"
            />

            <!-- Top penalty arc -->
            <path
                d="M 26.7 16.5
                   A 9.15 9.15 0 0 0 41.3 16.5"
                class="line"
                fill="none"
            />


            <!-- =========================
                 BOTTOM PENALTY AREA
                 ========================= -->

            <rect
                x="12.9"
                y="88.5"
                width="42.2"
                height="16.5"
                class="line"
            />

            <rect
                x="24.84"
                y="99.5"
                width="18.32"
                height="5.5"
                class="line"
            />

            <!-- Bottom penalty spot -->
            <circle
                cx="34"
                cy="94"
                r="0.5"
                class="spot"
            />

            <!-- Bottom penalty arc -->
            <path
                d="M 26.7 88.5
                   A 9.15 9.15 0 0 1 41.3 88.5"
                class="line"
                fill="none"
            />


            <!-- =========================
                 GOALS
                 ========================= -->

            <rect
                x="30.5"
                y="-2"
                width="7"
                height="2"
                class="goal"
            />

            <rect
                x="30.5"
                y="105"
                width="7"
                height="2"
                class="goal"
            />


            <!-- =========================
                 LOCATION MARKER
                 ========================= -->

            <circle
                id="marker"
                cx="34"
                cy="52.5"
                r="1.5"
            />

        </svg>

        <div class="goal-label">
            OUR GOAL
        </div>

    </div>


    <div id="coordinates">
        No location selected
    </div>

    <button id="clear-button">
        Clear
    </button>


    <script src="script.js"></script>

</body>

</html>
