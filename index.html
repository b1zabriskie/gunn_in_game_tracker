<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soccer Data Collection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Soccer Data Collection</h1>

    <p>Tap the location where the action started.</p>

    <div class="pitch-container">

        <div class="goal-label opponent">
            OPPONENT GOAL
        </div>

        <div id="pitch">

            <!-- Center line -->
            <div class="halfway-line"></div>

            <!-- Center circle -->
            <div class="center-circle"></div>
            <div class="center-spot"></div>

            <!-- Top penalty area -->
            <div class="penalty-area top"></div>
            <div class="goal-area top"></div>
            <div class="penalty-spot top"></div>

            <!-- Bottom penalty area -->
            <div class="penalty-area bottom"></div>
            <div class="goal-area bottom"></div>
            <div class="penalty-spot bottom"></div>

            <!-- Goals -->
            <div class="goal top"></div>
            <div class="goal bottom"></div>

            <!-- Location marker -->
            <div id="marker"></div>

        </div>

        <div class="goal-label own">
            OUR GOAL
        </div>

    </div>

    <div id="coordinates">
        No location selected
    </div>

    <button id="clear-button">Clear</button>

    <script src="script.js"></script>

</body>

</html>
