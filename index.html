<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soccer Data Collection</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Soccer Data Collection</h1>

    <p>Tap the location where the action started.</p>

    <div class="pitch-container">

        <!-- Opponent goal label -->
        <div class="goal-label side-label">
            OPPONENT GOAL
        </div>


        <!-- =========================
             SOCCER PITCH
             ========================= -->

        <svg
            id="pitch"
            viewBox="0 0 120 68"
            preserveAspectRatio="none"
        >

            <!-- Green field -->
            <rect
                x="0"
                y="0"
                width="120"
                height="68"
                class="pitch-background"
            />


            <!-- Outer boundary -->
            <rect
                x="0"
                y="0"
                width="120"
                height="68"
                class="line"
            />


            <!-- =========================
                 CENTER LINE
                 ========================= -->

            <line
                x1="60"
                y1="0"
                x2="60"
                y2="68"
                class="line"
            />


            <!-- =========================
                 CENTER CIRCLE
                 ========================= -->

            <circle
                cx="60"
                cy="34"
                r="10"
                class="line"
            />

            <circle
                cx="60"
                cy="34"
                r="0.5"
                class="spot"
            />


            <!-- =========================
                 LEFT PENALTY AREA
                 ========================= -->

            <rect
                x="0"
                y="12"
                width="18"
                height="44"
                class="line"
            />

            <!-- Left 6-yard box -->

            <rect
                x="0"
                y="24"
                width="6"
                height="20"
                class="line"
            />

            <!-- Left penalty spot -->

            <circle
                cx="12"
                cy="34"
                r="0.5"
                class="spot"
            />

            <!-- Left penalty arc -->

            <path
                d="M 18 26
                   A 10 10 0 0 1 18 42"
                class="line"
                fill="none"
            />


            <!-- =========================
                 RIGHT PENALTY AREA
                 ========================= -->

            <rect
                x="102"
                y="12"
                width="18"
                height="44"
                class="line"
            />

            <!-- Right 6-yard box -->

            <rect
                x="114"
                y="24"
                width="6"
                height="20"
                class="line"
            />

            <!-- Right penalty spot -->

            <circle
                cx="108"
                cy="34"
                r="0.5"
                class="spot"
            />

            <!-- Right penalty arc -->

            <path
                d="M 102 26
                   A 10 10 0 0 0 102 42"
                class="line"
                fill="none"
            />


            <!-- =========================
                 GOALS
                 ========================= -->

            <rect
                x="-2"
                y="30.5"
                width="2"
                height="7"
                class="goal"
            />

            <rect
                x="120"
                y="30.5"
                width="2"
                height="7"
                class="goal"
            />


            <!-- =========================
                 LOCATION MARKER
                 ========================= -->

            <circle
                id="marker"
                cx="60"
                cy="34"
                r="1.5"
            />

        </svg>


        <!-- Our goal label -->
        <div class="goal-label side-label">
            OUR GOAL
        </div>

    </div>


    <!-- =========================
         LOCATION INFORMATION
         ========================= -->

    <div id="coordinates">
        No location selected
    </div>


    <!-- Clear button -->

    <button id="clear-button">
        Clear
    </button>


    <script src="script.js"></script>

</body>

</html>
